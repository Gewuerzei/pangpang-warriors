<body>
<div id="app">
  <header class="header">
    <div class="brand"><div class="brand-face"><i></i><i></i></div><div><h1>胖胖战士 <span class="tiny-stars">✦</span></h1><p>胖胖军团出击！</p></div></div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" aria-label="开启声音" title="声音">🔇</button>
      <button class="icon-btn" id="howBtn" aria-label="玩法说明" title="玩法">❔</button>
      <button class="icon-btn" id="pauseBtn" aria-label="暂停游戏" title="暂停">Ⅱ</button>
    </div>
  </header>

  <div class="level-strip">
    <div class="era-chip"><span id="eraIcon">🌿</span><span id="eraName">青草部落</span></div>
    <div class="level-text">第 <strong id="stageNum">1</strong> 关 <span class="divider-dot">·</span> <span id="stageLabel">饭团争夺战</span></div>
    <div class="coins-chip" aria-label="永久金币">🪙 <b id="coinsCount">0</b></div>
  </div>

  <section class="battle-section" aria-label="战场">
    <div class="bases-hud">
      <div class="base-meter player-meter"><div class="base-meter-top"><span>🏠 胖胖营地</span><span id="ownHpText">100%</span></div><div class="bar"><div id="ownHpFill" class="fill own"></div></div></div>
      <div class="swords">⚔</div>
      <div class="base-meter enemy-meter"><div class="base-meter-top"><span>坏坏营地 🏴</span><span id="enemyHpText">100%</span></div><div class="bar"><div id="enemyHpFill" class="fill enemy"></div></div></div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="battleCanvas" aria-label="两支圆滚滚的军团正在战斗"></canvas>
      <div class="battle-top-note" id="battleNote" aria-live="polite">点击下方卡片，派出胖胖战士！</div>
      <div class="field-controls"><button class="field-btn" id="cameraBtn" aria-label="跟随战线">◎ 跟随</button><span class="time-counter" id="timeText">00:00</span></div>
    </div>
    <div class="minimap" aria-label="双方战线进度"><div class="map-line"><span class="home-flag">🏠</span><div id="mapBlue" class="army-dot blue-dot"></div><div id="mapRed" class="army-dot red-dot"></div><span class="enemy-flag">🏴</span></div></div>
  </section>

  <main class="control-section">
    <div class="food-heading"><div><span class="food-title">🍙 饭团</span><strong id="foodCount">120</strong><span class="max-food">/ <span id="maxFood">350</span></span></div><div class="food-rate" id="foodRate">+12 / 秒</div></div>
    <div class="food-bar"><div id="foodFill"></div></div>
    <div class="section-line"><span>选择出战的胖胖</span><span class="hint">点击即可派兵</span></div>
    <div class="unit-cards" id="unitCards">
      <button class="unit-card" data-unit="0"><div class="card-illustration"><div class="mini-body orange"><b class="eye left"></b><b class="eye right"></b><span class="mini-tool">🛡️</span></div></div><span class="unit-name">肉盾胖</span><span class="unit-desc">挨揍高手</span><span class="cost-pill">🍙 <b>45</b></span></button>
      <button class="unit-card" data-unit="1"><div class="card-illustration"><div class="mini-body yellow"><b class="eye left"></b><b class="eye right"></b><span class="mini-tool">🪓</span></div></div><span class="unit-name">冲冲胖</span><span class="unit-desc">近战猛将</span><span class="cost-pill">🍙 <b>75</b></span></button>
      <button class="unit-card" data-unit="2"><div class="card-illustration"><div class="mini-body teal"><b class="eye left"></b><b class="eye right"></b><span class="mini-tool">🏹</span></div></div><span class="unit-name">远射胖</span><span class="unit-desc">后排支援</span><span class="cost-pill">🍙 <b>115</b></span></button>
    </div>
    <div class="bottom-controls"><button id="hornBtn" class="ability-btn"><span class="ability-icon">📯</span><span><strong>胖胖冲锋</strong><small id="hornStatus">全军加速 6 秒</small></span><span class="ability-ready" id="hornTimer">就绪</span></button><button id="shopBtn" class="workshop-btn">🔧 研究所 <span id="upgradeDot" class="unseen"></span></button></div>
  </main>
  <footer class="footnote">原创离线小游戏 · 自动保存 · v1.0</footer>
</div>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button id="modalClose" class="modal-x" aria-label="关闭">×</button>
    <div id="modalEmoji" class="modal-emoji">🍙</div>
    <h2 id="modalTitle">胖胖战士</h2>
    <p id="modalText" class="modal-description"></p>
    <div id="modalExtra"></div>
    <div class="modal-actions" id="modalActions"></div>
  </section>
</div>
<div id="toast" aria-live="polite"></div>
<script>/* 胖胖战士 v1.0 · Original game by Piccola for Pietro · No external assets or libraries. */
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('battleCanvas');
  const ctx = canvas.getContext('2d', {alpha:false});
  const WORLD = 980;
  const SAVE_KEY = 'pangpang-warriors-save-v1';
  const eras = [
    {name:'青草部落',symbol:'🌿', sky:['#a6dddc','#eaf8dc'],hill:['#b4d79a','#8ab981'],ground:'#c9dd96', dirt:'#ab875e',names:['肉盾胖','冲冲胖','远射胖'],icons:['🛡️','🪓','🏹'],hint:'饭团争夺战'},
    {name:'小胖王朝',symbol:'🏯', sky:['#b6d9f2','#fff0c6'],hill:['#b3c8a1','#83a18a'],ground:'#c2d69a',dirt:'#c39a6d',names:['盾牌胖','长枪胖','弓箭胖'],icons:['🛡️','⚔️','🏹'],hint:'小胖争霸战'},
    {name:'蒸汽小镇',symbol:'⚙️', sky:['#c7c7dc','#f5dfc5'],hill:['#bcbab2','#919ba0'],ground:'#c2c1a2',dirt:'#8e877e',names:['铁甲胖','扳手胖','火枪胖'],icons:['🦾','🔧','🔫'],hint:'锅炉大作战'},
    {name:'星际胖胖',symbol:'🪐',sky:['#45446f','#9a76af'],hill:['#67628d','#474d78'],ground:'#9ca2ac',dirt:'#73778f',names:['护盾胖','闪电胖','光炮胖'],icons:['🛸','⚡','🔮'],hint:'银河饭团战'}
  ];
  const unitTypes = [
    {cost:45,hp:165,dmg:14,speed:38,range:43,delay:1.15,armor:.18,bounty:17},
    {cost:75,hp:116,dmg:28,speed:43,range:65,delay:1.05,armor:.03,bounty:22},
    {cost:115,hp:82,dmg:25,speed:33,range:205,delay:1.8,armor:0,bounty:28}
  ];
  const upgradeDefs = [
    {id:'attack',icon:'⚔️',title:'胖胖训练',desc:'我方单位伤害 +12%',start:45,step:37},
    {id:'income',icon:'🍙',title:'豪华饭桶',desc:'每秒额外获得 2.5 饭团',start:45,step:45},
    {id:'fort',icon:'🏠',title:'营地加固',desc:'基地最大生命 +160',start:35,step:30}
  ];
  const defaultSave = () => ({cleared:0,coins:0,upgrades:{attack:0,income:0,fort:0},sound:false});
  function readSave(){
    try{
      const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
      if(!raw||typeof raw!=='object')return defaultSave();
      const s=defaultSave();
      s.cleared=Math.min(999,Math.max(0,Math.floor(Number(raw.cleared)||0)));
      s.coins=Math.min(999999,Math.max(0,Math.floor(Number(raw.coins)||0)));
      for(const k of Object.keys(s.upgrades))s.upgrades[k]=Math.min(200,Math.max(0,Math.floor(Number(raw.upgrades?.[k])||0)));
      s.sound=!!raw.sound;
      return s;
    }catch{return defaultSave();}
  }
  let save=readSave();
  let audioContext=null;
  let game=null;
  let state='intro';
  let modalType=null;
  let modalCanClose=false;
  let noteUntil=0;
  let toastTimeout=0;
  let lastFrame=0;
  let viewW=390,viewH=340,dpr=1;
  let dragging=false,downX=0,lastPointerX=0;
  let userCameraUntil=0;
  let camera=0;
  let frameSeq=0;
  let motion=0;

  function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch{/* private-mode fallback */}}
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  function eraIndex(){return Math.min(eras.length-1,Math.floor(save.cleared/3));}
  const currentEra=()=>eras[eraIndex()];
  function upgradePrice(def){return Math.round(def.start+def.step*save.upgrades[def.id]*(1+save.upgrades[def.id]*.22));}

  function nearestEnemy(u){
    let best=null,d=Infinity;

  function update(dt){

    if(game.t>game.nextEnemy){
      const pick=(Math.random()<.50)?0:Math.random()<.67?1:2;
      spawnUnit(-1,pick);
      game.spawnNum++;
      if(game.stage>=3&&game.spawnNum%5===0)spawnUnit(-1,0);
      game.nextEnemy=game.t+Math.max(2.6,5.1-game.stage*.12-game.t*.004)+Math.random()*1.35;
    }
    const ground=worldGround();
    for(const u of game.units){
      if(u.hp<=0)continue;

      const info=nearestEnemy(u);
      const targetBase=u.side===1?{base:true,side:-1,x:WORLD-82}:{base:true,side:1,x:82};
      let target=info.target;
      let distance=info.distance;
      const baseDistance=(targetBase.x-u.x)*u.side;
      if(!target||baseDistance<distance){target=targetBase;distance=baseDistance;}
      if(distance<=u.range){
        if(u.cooldown<=0){strike(u,target);u.cooldown=u.delay;}
      }else{
        const boosted=u.side===1&&game.t<game.hornUntil;
        let speed=u.speed*(boosted?1.55:1)*dt;
        const friends=game.units.filter(v=>v.side===u.side&&v.hp>0&&v.id!==u.id);
        const ahead=friends.some(v=>(v.x-u.x)*u.side>0&&(v.x-u.x)*u.side<34);
        if(ahead)speed*=.27;
        u.x=clamp(u.x+u.side*speed,112,WORLD-112);
        u.walkPhase+=dt*8;
      }
    }
    game.units=game.units.filter(u=>u.hp>0);
    // Base defense is intentionally weak: it prevents early rushes without deciding the battle.
    for(const side of [1,-1]){
      const nearest=game.units.filter(u=>u.side!==side&&u.hp>0&&Math.abs(u.x-(side===1?85:WORLD-85))<170)
        .sort((a,b)=>Math.abs(a.x-(side===1?85:WORLD-85))-Math.abs(b.x-(side===1?85:WORLD-85)))[0];
      const key=side===1?'ownTowerAt':'enemyTowerAt';
      if(nearest&&game.t>=game[key]){
        game[key]=game.t+4.4;
        const x=side===1?88:WORLD-88;
        game.shots.push({x,y:ground-126,tx:nearest.x,targetId:nearest.id,targetBase:false,side,damage:28,speed:400,life:2,type:3});
      }
    }
    for(const shot of game.shots){
      const target=shot.targetBase?{base:true,side:-shot.side,x:shot.side===1?WORLD-82:82}:
        game.units.find(u=>u.id===shot.targetId&&u.hp>0);
      if(!target){shot.life=0;continue;}
      const diff=target.x-shot.x;
      const move=shot.speed*dt;
      if(Math.abs(diff)<=move+12){

    game.shots=game.shots.filter(s=>s.life>0);
    for(const p of game.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=75*dt;p.life-=dt;}

    ctx.clearRect(0,0,viewW,viewH);
    if(!game)return;
    if(state==='playing'&&performance.now()>userCameraUntil){
      const friendly=game.units.filter(u=>u.side===1&&u.hp>0);
      const lead=friendly.length?Math.max(...friendly.map(u=>u.x)):145;
      const target=clamp(lead-viewW*.35,0,Math.max(0,WORLD-viewW));
      camera+=(target-camera)*.035;
    }
    drawBackground();drawBase(63,1);drawBase(WORLD-63,-1);
    game.units.slice().sort((a,b)=>a.yOffset-b.yOffset).forEach(drawUnit);
    drawShots();drawParticles();
    if(state==='paused'){
      ctx.fillStyle='#27324c33';ctx.fillRect(0,0,viewW,viewH);
      ctx.fillStyle='#ffffffdd';ctx.font='900 28px sans-serif';ctx.textAlign='center';ctx.fillText('⏸ 胖胖休息中',viewW/2,viewH*.48);
    }
  }
  function frame(time){
    if(!lastFrame)lastFrame=time;
    const dt=Math.min((time-lastFrame)/1000,.05);lastFrame=time;frameSeq++;
    if(state==='playing')motion+=dt;
    update(dt);draw();
    if(noteUntil&&time>noteUntil){$('battleNote').classList.remove('visible');noteUntil=0;}
    requestAnimationFrame(frame);
  }
  function closeModal(){
    if(!modalCanClose)return;
    $('modalBackdrop').hidden=true;modalType=null;
    if(state==='paused'){state='playing';$('pauseBtn').textContent='Ⅱ';}
    updateHUD(true);
  }
  function modal({type,emoji,title,text,extra='',actions=[],closable=false}){
    modalType=type;modalCanClose=closable;
    $('modalBackdrop').hidden=false;
    $('modalEmoji').textContent=emoji;$('modalTitle').textContent=title;$('modalText').textContent=text;
    $('modalExtra').innerHTML=extra;
    $('modalClose').hidden=!closable;
    $('modalActions').replaceChildren();
    for(const action of actions){
      const b=document.createElement('button');b.className=action.secondary?'secondary-btn':'primary-btn';
      b.textContent=action.label;b.addEventListener('click',action.onClick);$('modalActions').append(b);
    }
  }
  function tutorial(){
    state='intro';
    modal({type:'intro',emoji:'🍙',title:'胖胖战士，集合！',text:'一群圆滚滚的小战士，为了世界上最好吃的饭团，决定展开一场热闹的基地争夺战。',
      extra:'<div class="guide"><p>🍙 饭团会自动增加，派兵要消耗饭团。</p><p>🛡️ 肉盾保护队友，🪓 近战冲锋，🏹 远程输出。</p><p>📯 冲锋号角可以短暂加强全军。</p><p>🏆 推倒敌方基地，获得金币升级军团，逐步开启新时代。</p><p>💾 进度自动保存在这台设备的浏览器。</p></div>',
      actions:[{label:'胖胖们！出发！',onClick:()=>{$('modalBackdrop').hidden=true;modalType=null;state='playing';$('pauseBtn').textContent='Ⅱ';hint('🍙 点下面的胖胖卡片派兵！',4);}}]});
  }
  function pause(){
    if(state==='intro'||state==='ended')return;
    if(modalType)return;
    if(state==='playing'){state='paused';$('pauseBtn').textContent='▶';hint('');}
    else{state='playing';$('pauseBtn').textContent='Ⅱ';}
    updateHUD();
  }
  function openGuide(){
    const wasPlaying=state==='playing';if(wasPlaying)state='paused';
    modal({type:'guide',emoji:'📜',title:'胖胖作战手册',text:'一场轻松的小规模出兵对推战。方向不用控制，胖胖会自己寻找敌人。',
      extra:'<div class="guide"><p>🍙 派兵消耗饭团，饭团自动恢复，击败敌人还会掉落奖励。</p><p>🛡️ 肉盾血厚，🪓 冲锋攻击强，🏹 远射可以站在肉盾身后攻击。</p><p>📯 号角激活后 6 秒内，我方全军跑得更快、打得更痛。</p><p>👆 在战场左右滑动可暂时看别处；点「跟随」恢复自动镜头。</p><p>🪙 每场胜利获得金币，去研究所升级伤害、食物生产与营地。</p><p>📱 iPhone 安装：把网站部署到 HTTPS，再用 Safari 打开，点「分享」→「添加到主屏幕」。</p><p>🔐 完全本地运行，不上传账号或存档。</p></div>',
      actions:[{label:'明白了！',onClick:()=>{ $('modalBackdrop').hidden=true;modalType=null;state=wasPlaying?'playing':(state==='ended'?'ended':'paused');$('pauseBtn').textContent=state==='playing'?'Ⅱ':'▶';updateHUD(true);}}],closable:false});
  }
  function shopContent(){
    return '<div class="shop-header">🪙 当前金币：'+save.coins+'</div><div class="upgrades-list">'+upgradeDefs.map(def=>{
      const lv=save.upgrades[def.id],price=upgradePrice(def);
      return `<div class="upgrade-row"><div class="upgrade-icon">${def.icon}</div><div class="upgrade-text"><strong>${def.title} Lv.${lv}</strong><small>${def.desc}</small></div><button data-upgrade="${def.id}" class="upgrade-buy" ${save.coins<price?'disabled':''}>🪙 ${price}</button></div>`;
    }).join('')+'</div>';
  }
  function wireShop(){
    $('modalExtra').querySelectorAll('[data-upgrade]').forEach(button=>button.addEventListener('click',()=>{
      const def=upgradeDefs.find(d=>d.id===button.dataset.upgrade);
      const price=upgradePrice(def);
      if(save.coins<price)return;
      save.coins-=price;save.upgrades[def.id]++;
      persist();updateMeta();beep(650,.09,'triangle');
      $('modalExtra').innerHTML=shopContent();wireShop();
      if(game&&state==='paused'){
        game.income=12+save.upgrades.income*2.5;
        game.maxFood=350+save.upgrades.income*45;
      }
      updateHUD(true);
    }));
  }
  function openShop(){
    if(state==='intro'||modalType)return;
    const wasPlaying=state==='playing';if(wasPlaying)state='paused';
    modal({type:'shop',emoji:'🔧',title:'胖胖研究所',text:'用战斗赚到的金币，把胖胖军团变得更强！',extra:shopContent(),
      actions:[{label:wasPlaying?'返回战场':'关闭研究所',onClick:()=>{
        $('modalBackdrop').hidden=true;modalType=null;if(wasPlaying)state='playing';
        $('pauseBtn').textContent=state==='playing'?'Ⅱ':'▶';updateHUD(true);
      }}]});wireShop();
  }
  function showOutcome(won,reward,newEra){
    const winText=newEra?'一个崭新的时代解锁了！下一关将进入 '+eras[eraIndex()].name+'。':
      won?'坏坏营地被胖胖们推倒啦！':'胖胖营地没守住，但大家学到了很多。';
    modal({type:'outcome',emoji:won?(newEra?'🌟':'🏆'):'🥹',title:won?'胖胖大胜利！':'胖胖们再来一次！',
      text:winText,extra:`<div class="medal">${won?'✨ 胜利奖赏':'🍀 再接再厉'}　+${reward} 🪙</div>`+shopContent(),
      actions:[{label:won?'下一关，出发！':'再战一场！',onClick:()=>{
        $('modalBackdrop').hidden=true;modalType=null;createBattle();state='playing';$('pauseBtn').textContent='Ⅱ';hint('🍙 新的一场！派出你的胖胖军团！',3);
      }}]});wireShop();
  }
  $('unitCards').addEventListener('click',e=>{
    const btn=e.target.closest('[data-unit]');if(btn)deploy(+btn.dataset.unit);
  });
  $('hornBtn').addEventListener('click',horn);
  $('pauseBtn').addEventListener('click',pause);
  $('soundBtn').addEventListener('click',()=>{save.sound=!save.sound;persist();updateMeta();beep(640,.10,'sine');});
  $('howBtn').addEventListener('click',openGuide);
  $('shopBtn').addEventListener('click',openShop);
  $('modalClose').addEventListener('click',closeModal);
  $('cameraBtn').addEventListener('click',()=>{userCameraUntil=0;toast('🎯 已恢复跟随战线');});
  canvas.addEventListener('pointerdown',e=>{dragging=true;downX=e.clientX;lastPointerX=e.clientX;});
  canvas.addEventListener('pointermove',e=>{
    if(!dragging)return;
    if(Math.abs(e.clientX-downX)>7){camera=clamp(camera+(lastPointerX-e.clientX),0,Math.max(0,WORLD-viewW));userCameraUntil=performance.now()+3500;}
    lastPointerX=e.clientX;
  });
  window.addEventListener('pointerup',()=>dragging=false);
  window.addEventListener('pointercancel',()=>dragging=false);
  window.addEventListener('keydown',e=>{
    if(e.target.closest?.('input,textarea'))return;
    if(modalType)return;
    if(['1','2','3'].includes(e.key))deploy(Number(e.key)-1);
    if(e.key===' '){e.preventDefault();horn();}
    if(e.key.toLowerCase()==='p')pause();
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause();lastFrame=performance.now();});
  window.addEventListener('resize',resize);
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
  createBattle();resize();tutorial();requestAnimationFrame(frame);
  // Read-only minimal diagnostic hook for smoke tests. No hidden gameplay unlocks.
  window.PangpangStatus=()=>({state,stage:game?.stage,playerUnits:game?.units.filter(u=>u.side===1).length,
    enemyUnits:game?.units.filter(u=>u.side===-1).length,food:Math.floor(game?.food||0),coins:save.coins,era:currentEra().name});
})();
</script>
</body>
